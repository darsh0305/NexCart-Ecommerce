{% extends 'base.html' %}
{% load static %}

{% block title %}
Forgot Password - NexCart
{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <img src="{% static 'images/logo.jpeg' %}" alt="NexCart" class="auth-logo">

        <h1>Forgot Password?</h1>

        <p class="auth-subtitle">
            Enter your email address and we'll
            send you a password reset link.
        </p>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="auth-button"
            >
                Send Reset Link
            </button>

        </form>

    </div>

</div>

{% endblock %}
